<!doctype html>
<meta charset="utf-8">
<title>Local CAD viewer smoke test</title>
<div id="viewer" style="width:600px;height:400px"></div>
<pre id="result">pending</pre>
<script type="module">
  import { createLocalViewer } from '../js/cad-local.js';
  try {
    const response = await fetch('./fixtures/cad-cube.stp');
    const blob = await response.blob();
    const viewer = createLocalViewer(document.getElementById('viewer'), () => {});
    const components = await viewer.load(new File([blob], 'cube.stp'));
    document.getElementById('result').textContent = JSON.stringify({ok: components.length > 0, components: components.length, canvas: !!document.querySelector('canvas')});
    viewer.dispose();
  } catch (error) {
    document.getElementById('result').textContent = JSON.stringify({ok: false, error: error.message});
  }
</script>
